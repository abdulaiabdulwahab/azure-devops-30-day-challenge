apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-api
  namespace: devops-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-api

  template:
    metadata:
      labels:
        app: devops-api

    spec:
      containers:
        - name: devops-api

          image: dockeracrtest.azurecr.io/devops-api:v1

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: devops-api-config

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20