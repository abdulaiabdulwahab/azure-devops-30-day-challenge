```yaml
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: terraform-secrets

- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/learn-terraform-azure'

- name: terraformVersion
  value: '1.13.0'

steps:

# ==========================================================
# CHECKOUT REPOSITORY
# ==========================================================

- checkout: self
  displayName: 'Checkout GitHub repository'


# ==========================================================
# INSTALL TERRAFORM
# ==========================================================

- bash: |
    set -e

    echo "Installing Terraform $(terraformVersion)..."

    wget -q \
      "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"

    unzip -q \
      "terraform_$(terraformVersion)_linux_amd64.zip"

    sudo mv terraform /usr/local/bin/terraform

    echo "Terraform installed:"
    terraform version

  displayName: 'Install Terraform'


# ==========================================================
# TERRAFORM FORMAT CHECK
# ==========================================================

- bash: |
    set -e

    echo "Terraform working directory:"
    pwd

    echo "Running terraform fmt..."

    terraform fmt -check -recursive

  workingDirectory: '$(terraformDirectory)'
  displayName: 'Terraform Format Check'


# ==========================================================
# TERRAFORM INIT, VALIDATE AND PLAN
# ==========================================================

- task: AzureCLI@2
  displayName: 'Terraform Init, Validate and Plan'

  inputs:
    azureSubscription: 'sc-azure-terraform-dev'
    scriptType: bash
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    workingDirectory: '$(terraformDirectory)'

    inlineScript: |
      set -e

      echo "=========================================="
      echo "Preparing Azure authentication"
      echo "=========================================="

      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
      export ARM_USE_OIDC=true
      export ARM_OIDC_TOKEN="$idToken"

      echo "Azure subscription:"
      az account show \
        --query "{name:name,id:id}" \
        -o table


      echo ""
      echo "=========================================="
      echo "Terraform Init"
      echo "=========================================="

      terraform init -input=false


      echo ""
      echo "=========================================="
      echo "Terraform Validate"
      echo "=========================================="

      terraform validate


      echo ""
      echo "=========================================="
      echo "Terraform Plan"
      echo "=========================================="

      terraform plan \
        -input=false \
        -out=tfplan


      echo ""
      echo "=========================================="
      echo "Terraform Plan Summary"
      echo "=========================================="

      terraform show \
        -no-color \
        tfplan


      echo ""
      echo "Terraform init, validate and plan completed successfully."

  env:
    TF_TOKEN_app_terraform_io: $(TF_TOKEN_app_terraform_io)
```
