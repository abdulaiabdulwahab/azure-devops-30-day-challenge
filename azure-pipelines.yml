trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/learn-terraform-azure'

- name: terraformVersion
  value: '1.13.0'

steps:
- checkout: self
  displayName: 'Checkout repository'

- bash: |
    set -e

    wget -q \
      "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"

    unzip -q \
      "terraform_$(terraformVersion)_linux_amd64.zip"

    sudo mv terraform /usr/local/bin/terraform

    terraform version
  displayName: 'Install Terraform'

- bash: |
    set -e

    echo "Current directory:"
    pwd

    echo "Contents:"
    ls -la

    echo "Terraform files:"
    ls -la *.tf

    terraform init -backend=false -input=false
    terraform validate

  workingDirectory: '$(terraformDirectory)'
  displayName: 'Terraform Init and Validate'