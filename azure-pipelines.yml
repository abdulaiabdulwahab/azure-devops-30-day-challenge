trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: terraform-secrets

- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/learn-terraform-azure'

steps:
- checkout: self

- task: AzureCLI@2
  displayName: Test Azure and HCP access
  inputs:
    azureSubscription: 'sc-azure-terraform-dev'
    scriptType: bash
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    workingDirectory: '$(terraformDirectory)'
    inlineScript: |
      echo "Azure connection works"
      az account show -o table

      echo "Terraform directory:"
      pwd
  env:
    TF_TOKEN_app_terraform_io: $(TF_TOKEN_app_terraform_io)